name: Backend CI & Container Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Mock .env File
        run: |
          cat <<EOF > .env
          POSTGRES_USER=appuser
          POSTGRES_PASSWORD=secretpass
          POSTGRES_DB=travel_db
          DATABASE_URL=postgresql://appuser:secretpass@postgres:5432/travel_db
          REDIS_URL=redis://redis:6379/0
          EOF

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build and Start Containers
        run: docker compose up -d --build

      - name: Verify Container Health Checks
        run: |
          echo "Waiting for services to become healthy..."
          timeout 60s bash -c '
            until [ "$(docker inspect --format="{{.State.Health.Status}}" travel_postgres)" == "healthy" ] && \
                  [ "$(docker inspect --format="{{.State.Health.Status}}" travel_redis)" == "healthy" ]; do
              sleep 2
            done
          '
          echo "PostgreSQL and Redis are healthy!"

      - name: Test API Health Endpoint
        run: |
          echo "Testing API endpoint..."
          curl --fail http://localhost:8000/health || exit 1
          echo "API is responsive!"

      - name: View Container Logs on Failure
        if: failure()
        run: docker compose logs
